name: Frontend CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'hrm_frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [master]
    paths:
      - 'hrm_frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrm_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hrm_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
