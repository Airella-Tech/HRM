name: Mobile CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'hrm_mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [master]
    paths:
      - 'hrm_mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrm_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test
