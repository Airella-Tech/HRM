name: Backend CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'hrm_backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [master]
    paths:
      - 'hrm_backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - Admin_Backend
          - Employee_Backend
          - HR_Backend
          - User_Backend
    defaults:
      run:
        working-directory: hrm_backend/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.service }}-${{ hashFiles(format('hrm_backend/{0}/**/*.gradle*', matrix.service), format('hrm_backend/{0}/gradle/wrapper/gradle-wrapper.properties', matrix.service)) }}
          restore-keys: |
            gradle-${{ matrix.service }}-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build and run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: hrm_backend/${{ matrix.service }}/build/reports/tests
          retention-days: 7
