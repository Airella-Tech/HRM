# ============================================
# Recruitment Service — Application Configuration
# ============================================

# ── .env file location (spring-dotenv reads this at root level) ──
env:
  directory: ../

spring:
  application:
    name: recruitment-service

  # ── PostgreSQL Database ──────────────────
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${RECRUITMENT_DB_NAME:hrm_db_recruitment}
    username: ${RECRUITMENT_DB_USERNAME:postgres}
    password: ${RECRUITMENT_DB_PASSWORD:}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000

  # ── JPA/Hibernate ────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ── Resume uploads (Spring default is only 1MB) ──
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ── Mail (same pattern as Admin_Backend) ──
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# ── Server ─────────────────────────────────
server:
  port: ${RECRUITMENT_SERVICE_PORT:5008}

# ── App settings ───────────────────────────
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  resume:
    upload-dir: ${RESUME_UPLOAD_DIR:./uploads/resumes}

# ── JWT (must be the same secret as the other services) ──
jwt:
  secret: ${JWT_SECRET:hrm-dev-secret-key-change-this-in-production-must-be-at-least-256-bits-long-for-hs256}
  expiration: ${JWT_EXPIRATION:86400000}

# ── Inter-Service URLs ─────────────────────
service:
  user-url: ${USER_SERVICE_URL:http://localhost:5004}

# ── CORS ───────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ── Logging ────────────────────────────────
logging:
  level:
    root: INFO
    com.airella.hrm: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
