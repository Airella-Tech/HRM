# ============================================
# Recruitment Service — Application Configuration
# ============================================

# ── .env file location (spring-dotenv reads this at root level) ──
env:
  directory: ../

spring:
  application:
    name: recruitment-service

  # ── PostgreSQL Database (Credentials loaded from .env) ──
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${RECRUITMENT_DB_NAME:hrm_db_recruitment}
    username: ${RECRUITMENT_DB_USERNAME:postgres}
    password: ${RECRUITMENT_DB_PASSWORD:}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000

  # ── JPA/Hibernate ────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ── File Upload (Resumes) ────────────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ── Server ─────────────────────────────────
server:
  port: ${RECRUITMENT_SERVICE_PORT:5008}

# ── JWT (Loaded from .env) ─────────────────
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# ── CORS ───────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ── Upload directory for resumes ───────────
app:
  upload:
    dir: uploads/resumes

# ── Logging ────────────────────────────────
logging:
  level:
    root: INFO
    com.airella.hrm: ${LOG_LEVEL:INFO}
    org.springframework.security: INFO
