spring.application.name=recruitment
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;NON_KEYWORDS=YEAR,MONTH,DAY,VALUE,KEY
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=hrm-dev-secret-key-change-this-in-production-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000
service.user-url=http://localhost:5004
cors.allowed-origins=http://localhost:5173
app.frontend.url=http://localhost:5173